[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/qt"]
# `cargo build` builds the Qt frontend (no CEF download); build the CEF one with `-p rustcord`.
default-members = ["crates/core", "crates/qt"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
